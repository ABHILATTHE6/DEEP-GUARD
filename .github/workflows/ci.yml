name: DEEP-Guard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Check Python syntax
        run: python -m compileall -q backend ml scripts
      - name: Run tests when present
        run: |
          if [ -d tests ]; then pytest -q; else echo 'No tests directory yet'; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build dashboard
        run: npm run build

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment container
        run: docker build --tag deep-guard:ci .
      - name: Start deployment container
        run: docker run --detach --name deep-guard-smoke --publish 8080:8080 deep-guard:ci
      - name: Smoke-test dashboard, health API, and image inference
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health > /tmp/deep-guard-health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/deep-guard-health.json
          curl --fail --silent http://127.0.0.1:8080/ | grep -q '<div id="root"></div>'
          python - <<'PY'
          import struct
          import zlib

          def chunk(kind: bytes, data: bytes) -> bytes:
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )

          width = height = 32
          pixels = b"".join(b"\x00" + bytes((72, 118, 164)) * width for _ in range(height))
          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(pixels))
              + chunk(b"IEND", b"")
          )
          with open("/tmp/deep-guard-smoke.png", "wb") as image:
              image.write(png)
          PY
          curl --fail --silent --show-error \
            --form "media=@/tmp/deep-guard-smoke.png;type=image/png" \
            http://127.0.0.1:8080/api/v1/analyze > /tmp/deep-guard-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/deep-guard-result.json").read_text())
          assert result.get("modality") == "image", result
          assert result.get("status") == "ready", result
          assert {"ai_generated", "real"} <= set(result.get("scores", {})), result
          print("Container image inference smoke test passed:", result.get("verdict"), result.get("model"))
          PY
          docker exec deep-guard-smoke ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=blue:s=64x64:r=4:d=2" -an -c:v libx264 -pix_fmt yuv420p -y /tmp/deep-guard-smoke.mp4
          docker cp deep-guard-smoke:/tmp/deep-guard-smoke.mp4 /tmp/deep-guard-smoke.mp4
          curl --fail --silent --show-error \
            --form "media=@/tmp/deep-guard-smoke.mp4;type=video/mp4" \
            http://127.0.0.1:8080/api/v1/analyze > /tmp/deep-guard-video.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/deep-guard-video.json").read_text())
          assert result.get("modality") == "video", result
          assert result.get("status") == "experimental_frame_based", result
          assert {"ai_generated", "real"} <= set(result.get("scores", {})), result
          assert result.get("frames_sampled", 0) > 0, result
          print("Container video-frame smoke test passed:", result.get("verdict"), result.get("frames_sampled"))
          PY
          cat > /tmp/deep-guard-audio-smoke.py <<'PY'
          from pathlib import Path
          from types import SimpleNamespace

          import numpy as np
          import soundfile as sf
          import torch

          from ml.media.audio import analyze_audio

          class DummyAudioModel(torch.nn.Module):
              def __init__(self):
                  super().__init__()
                  self.anchor = torch.nn.Parameter(torch.zeros(()))
                  self.config = SimpleNamespace(id2label={0: "REAL", 1: "FAKE"})

              def forward(self, input_values):
                  logits = torch.tensor([[0.1, 2.0]], device=input_values.device)
                  return SimpleNamespace(logits=logits)

          sample_rate = 16000
          time = np.arange(sample_rate * 2, dtype=np.float32) / sample_rate
          waveform = (0.2 * np.sin(2 * np.pi * 220 * time)).astype(np.float32)
          audio_path = Path("/tmp/deep-guard-smoke.wav")
          sf.write(audio_path, waveform, sample_rate)
          result = analyze_audio(audio_path, model=DummyAudioModel())
          assert result.get("modality") == "audio", result
          assert result.get("status") == "experimental_pretrained", result
          assert result["scores"]["ai_generated"] > result["scores"]["real"], result
          print("Container audio preprocessing/model-contract smoke test passed.")
          PY
          docker cp /tmp/deep-guard-audio-smoke.py deep-guard-smoke:/tmp/deep-guard-audio-smoke.py
          docker exec deep-guard-smoke python /tmp/deep-guard-audio-smoke.py
          printf 'not an actual image' > /tmp/deep-guard-invalid.png
          invalid_status="$(curl --silent --output /tmp/deep-guard-invalid.json --write-out '%{http_code}' \
            --form "media=@/tmp/deep-guard-invalid.png;type=image/png" \
            http://127.0.0.1:8080/api/v1/analyze)"
          test "$invalid_status" = "400"
          grep -q "not a valid, readable image file" /tmp/deep-guard-invalid.json
          echo "Invalid image upload returns HTTP 400 as expected."
      - name: Show container logs on failure
        if: failure()
        run: docker logs deep-guard-smoke || true
      - name: Remove deployment container
        if: always()
        run: docker rm --force deep-guard-smoke || true
