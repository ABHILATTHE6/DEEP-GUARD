[project]
name = "deep-guard"
version = "0.1.0"
description = "Multimodal AI-generated media and deepfake detection platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "transformers>=4.45,<6",
  "opencv-python>=4.10,<5",
  "librosa>=0.10,<1",
]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
